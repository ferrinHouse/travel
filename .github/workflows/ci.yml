name: Deploy Travel Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. BUILD DOCKER IMAGE FOR ARM64 AND PUSH TO GHCR
  build-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ferrinhouse/travel-site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. DEPLOY TO KUBERNETES
  deploy:
    runs-on: self-hosted
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k k8s
          echo "Kubernetes configuration applied."

      - name: Trigger Rolling Restart
        run: |
          kubectl rollout restart deployment/travel-site-deployment
          echo "Rollout restart triggered."
