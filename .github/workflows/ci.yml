name: Deploy Travel Site

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Step 1: Sync the web files (HTML/CSS/JS)
            - name: Sync Web Files
              run: |
                  rsync -avz --delete ./ /home/mferrin/familyTravel/
                  echo "Web files synced."

            # Step 2: Apply Kubernetes Manifests
            # This ensures any changes to your YAML are live immediately
            - name: Apply Kubernetes Manifests
              run: |
                  kubectl apply -f family-travel.yaml
                  echo "Kubernetes configuration updated."
