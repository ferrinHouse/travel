name: Deploy Travel Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # Tests and the image build run in parallel. The build only pushes an
  # immutable per-commit tag; `latest` (which the cluster pulls on every
  # restart) is promoted only after both have passed.

  # 1a. RUN THE TEST SUITE (same workflow that runs on pull requests)
  test:
    uses: ./.github/workflows/test.yml

  # 1b. BUILD DOCKER IMAGE FOR ARM64 AND PUSH IT AS sha-<commit>
  build-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ferrinhouse/travel-site:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. TAG THE TESTED IMAGE AS latest (registry-side copy, no rebuild)
  promote:
    runs-on: ubuntu-24.04
    needs: [test, build-image]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote sha-${{ github.sha }} to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/ferrinhouse/travel-site:latest \
            ghcr.io/ferrinhouse/travel-site:sha-${{ github.sha }}

  # 3. DEPLOY TO KUBERNETES
  deploy:
    runs-on: self-hosted
    needs: promote
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k k8s
          echo "Kubernetes configuration applied."

      - name: Trigger Rolling Restart and Verify Rollout
        run: |
          kubectl rollout restart deployment/travel-site-deployment
          kubectl rollout status deployment/travel-site-deployment --timeout=300s
          echo "Rollout successfully completed."
