apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/storage.yaml
  - base/uploads-storage.yaml
  - base/deployment.yaml
  - base/service.yaml

patches:
  - path: patches/nfs-server.yaml

configMapGenerator:
  - name: travel-config
    literals:
      # Public address of the site behind the reverse proxy (no trailing slash).
      # Passkeys are bound to this hostname, so changing it later invalidates them.
      - APP_ORIGIN=https://travel.ferrinhouse.org
